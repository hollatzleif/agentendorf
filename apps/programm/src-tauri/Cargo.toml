[package]
name = "agentendorf"
version = "0.1.0"
description = "Agentendorf – Desktop-Programm"
edition = "2021"
publish = false

[lib]
name = "agentendorf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
