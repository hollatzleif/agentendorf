name: Prüfen und ausliefern

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dorf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typen prüfen
        run: pnpm typecheck
      - name: Bauen
        run: pnpm build
      - name: Server- und Werkstatt-Tests (Leine, Freigaben, Motoren, Vault-Regeln, Login, Moodle, Rechenraum)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pnpm test
      - name: Codehaus – Start des Containers ohne Docker (Geheimnisse, Token nicht im Protokoll, Git/GitHub, Projektliste)
        run: bash apps/coding/test/start-test.sh
      - name: Rechenraum-Runner (Geheimnis, Zeitlimit, Pfade, Aufräumen)
        run: python3 -m unittest discover -s apps/rechenraum/test -v
      - name: Browser-Tests (Desktop und Handy)
        run: |
          pnpm --filter @dorf/web exec playwright install --with-deps chromium
          pnpm e2e
      - name: Moodle-Browser gegen nachgebautes Moodle (Anmeldung, Leine, Download)
        run: pnpm --filter @dorf/browser e2e
      - name: Backup- und Deploy-Tests (7 Tage, Wiederherstellung, Rollback)
        run: |
          sudo apt-get install -y -q restic sqlite3 jq shellcheck
          bash deploy/test/backup-test.sh
          bash deploy/test/empfangen-test.sh
          bash deploy/test/moodle-anmelden-test.sh
          bash deploy/test/coding-einrichten-test.sh
      - name: Codehaus – Zugang zu VS Code mit dem echten Caddyfile (Anmeldung, Einmal-Karte, forward_auth, WebSocket)
        run: |
          sudo apt-get install -y -q caddy
          sudo systemctl stop caddy || true
          CADDY_PFLICHT=1 bash deploy/test/coding-zugang-test.sh
      - name: Shell-Skripte prüfen
        run: shellcheck -x -S warning deploy/dorf deploy/bootstrap.sh deploy/programme-manifest.sh deploy/test/*.sh apps/coding/*.sh apps/coding/test/*.sh

  # ---- Etappe 6: Programme für Mac und Windows (Tauri) ----------------------------------------------
  programm-selbsttest:
    name: Programm – Selbsttest der Freigaben (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dorf/shared --filter @dorf/web build
      - name: Linux-Bibliotheken für Tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/programm/src-tauri -> target
      - name: Rust-Tests (Adresse prüfen)
        run: cargo test --manifest-path apps/programm/src-tauri/Cargo.toml
      - name: Selbsttest – Dorf-Seite darf nur die freigegebenen Befehle
        run: |
          (cd apps/web && bash e2e/server-starten.sh > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3999/api/gesundheit && break; sleep 1; done
          bash apps/programm/test/selbsttest.sh

  programme-pruefen:
    name: Programme – schon auf dem Server?
    runs-on: ubuntu-24.04
    outputs:
      kennung: ${{ steps.k.outputs.kennung }}
      bauen: ${{ steps.k.outputs.bauen }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HAT_SCHLUESSEL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          # Kennung = Hash über alles, was ins Programm eingeht (+ ob signiert wird); gleich → nicht neu bauen
          K=$( (cd apps/programm && find einrichten src-tauri/src src-tauri/capabilities src-tauri/icons src-tauri/toene -type f | sort | xargs cat; \
                cat src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/build.rs src-tauri/tauri.conf.json package.json; echo "$HAT_SCHLUESSEL") | sha256sum | cut -c1-16)
          echo "kennung=$K" >> "$GITHUB_OUTPUT"
          HAT=nein
          if [ -n "$DEPLOY_HOST" ] && [ "${{ github.ref }}" = refs/heads/main ] && [ "${{ github.event_name }}" != pull_request ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            HAT=$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "hat-programme $K" 2>/dev/null || echo nein)
          fi
          [ "$HAT" = ja ] || HAT=nein
          echo "Server hat Programme $K: $HAT"
          if [ "$HAT" = ja ] || [ "${{ github.event_name }}" = pull_request ]; then echo "bauen=nein" >> "$GITHUB_OUTPUT"; else echo "bauen=ja" >> "$GITHUB_OUTPUT"; fi

  programme:
    name: Programm bauen (${{ matrix.name }})
    needs: [programme-pruefen, programm-selbsttest]
    if: needs.programme-pruefen.outputs.bauen == 'ja'
    strategy:
      fail-fast: false
      matrix:
        # Mac vorerst nicht (Leifs Wunsch, 18.11.: Mac-Minuten zählen zehnfach). Wieder einschalten:
        #   - name: Mac
        #     os: macos-latest
        #     buendel: app,dmg
        #     ziel: aarch64-apple-darwin
        # und unten bei „vollständig“ programme-Mac wieder mitprüfen.
        include:
          - name: Windows
            os: windows-latest
            buendel: nsis
            ziel: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.ziel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/programm/src-tauri -> target
      - name: Bauen
        working-directory: apps/programm
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "$VERSION" > /tmp/version
          # ohne Signaturschlüssel (GitHub-Secret TAURI_SIGNING_PRIVATE_KEY) gibt es keine Update-Dateien – Installer schon
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then UPD=true; else UPD=false; echo "::warning::TAURI_SIGNING_PRIVATE_KEY fehlt – Programme ohne automatische Updates."; fi
          npx --yes @tauri-apps/cli@2.12.5 build --ci --target "${{ matrix.ziel }}" --bundles "${{ matrix.buendel }}" \
            --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":$UPD}}"
      - name: Einsammeln
        run: |
          V=$(cat /tmp/version)
          B=apps/programm/src-tauri/target/${{ matrix.ziel }}/release/bundle
          mkdir -p ausgabe && echo "$V" > ausgabe/VERSION
          if [ "${{ matrix.name }}" = Mac ]; then
            cp "$B/dmg/Agentendorf_${V}_aarch64.dmg" ausgabe/
            if [ -f "$B/macos/Agentendorf.app.tar.gz" ]; then
              cp "$B/macos/Agentendorf.app.tar.gz" "ausgabe/Agentendorf_${V}_aarch64.app.tar.gz"
              cp "$B/macos/Agentendorf.app.tar.gz.sig" "ausgabe/Agentendorf_${V}_aarch64.app.tar.gz.sig"
            fi
          else
            cp "$B/nsis/Agentendorf_${V}_x64-setup.exe" ausgabe/
            [ ! -f "$B/nsis/Agentendorf_${V}_x64-setup.exe.sig" ] || cp "$B/nsis/Agentendorf_${V}_x64-setup.exe.sig" ausgabe/
          fi
          ls -l ausgabe
      - uses: actions/upload-artifact@v4
        with:
          name: programme-${{ matrix.name }}
          path: ausgabe/
          retention-days: 7

  ausliefern:
    name: Image bauen und deployen
    needs: [pruefen, programme-pruefen, programme]
    # die Programme sind ein Zusatz: scheitern sie, wird das Dorf trotzdem ausgeliefert (ohne neue Programme)
    if: ${{ !cancelled() && needs.pruefen.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SSH vorbereiten und fragen, ob der Server das Rechenraum-Image schon hat
        id: rechenraum
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Kennung = Hash über Dockerfile, Runner und Dorfwerk (E199); gleiches Rezept → gleiches Image → nicht erneut schicken
          RV=$(cat apps/rechenraum/Dockerfile apps/rechenraum/runner.py apps/rechenraum/dorfwerk.py | sha256sum | cut -c1-16)
          echo "kennung=$RV" >> "$GITHUB_OUTPUT"
          HAT=nein
          if [ -n "$DEPLOY_HOST" ] && [ "${{ github.ref }}" = refs/heads/main ] && [ "${{ github.event_name }}" != pull_request ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            # ältere dorf-Skripte kennen hat-image nicht → wie „nein“ behandeln
            HAT=$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "hat-image $RV" 2>/dev/null || echo nein)
          fi
          echo "Server hat agentendorf-rechenraum:$RV: $HAT"
          echo "hat=$HAT" >> "$GITHUB_OUTPUT"
          # Moodle-Browser: gleiche Idee; ältere dorf-Skripte kennen hat-browser nicht → „nein“
          BV=$(cat apps/browser/Dockerfile apps/browser/package.json apps/browser/src/*.ts | sha256sum | cut -c1-16)
          echo "browser_kennung=$BV" >> "$GITHUB_OUTPUT"
          HATB=nein
          if [ -f ~/.ssh/id_ed25519 ]; then
            HATB=$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "hat-browser $BV" 2>/dev/null || echo nein)
          fi
          [ "$HATB" = ja ] || HATB=nein
          echo "Server hat agentendorf-browser:$BV: $HATB"
          echo "browser_hat=$HATB" >> "$GITHUB_OUTPUT"
          # Codehaus (E191): großes Image (VS Code, Compiler) – Kennung über alles, was hineingeht (auch den Runner der
          # Werkstatt). Antwort des Servers: ja (hat es) · nein (eingerichtet, Image fehlt → bauen und mitschicken) ·
          # aus (Codehaus dort nicht eingerichtet). Alles andere – auch ältere dorf-Skripte ohne hat-coding – zählt als
          # „aus“: Das große Image wird nur gebaut und übertragen, wenn der Server es wirklich will (E195).
          CV=$(cat apps/coding/Dockerfile apps/coding/start.sh apps/coding/gesund.sh apps/werkstatt/package.json apps/werkstatt/bauen.mjs apps/werkstatt/src/*.ts | sha256sum | cut -c1-16)
          echo "coding_kennung=$CV" >> "$GITHUB_OUTPUT"
          # ohne Deploy-Schlüssel (Prüfläufe): bauen und rauchtesten wie bisher, damit das Rezept geprüft bleibt
          HATC=nein
          if [ -f ~/.ssh/id_ed25519 ]; then
            HATC=$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "hat-coding $CV" 2>/dev/null || echo aus)
            case "$HATC" in ja|nein) ;; *) HATC=aus ;; esac
          fi
          echo "Server hat agentendorf-coding:$CV: $HATC"
          echo "coding_hat=$HATC" >> "$GITHUB_OUTPUT"
      - name: Images bauen
        run: |
          docker build -t agentendorf:ci .
          docker build -f apps/werkstatt/Dockerfile -t agentendorf-werkstatt:ci .
      - name: Rechenraum-Image bauen (nur wenn der Server es noch nicht hat)
        if: steps.rechenraum.outputs.hat != 'ja'
        run: docker build -f apps/rechenraum/Dockerfile -t "agentendorf-rechenraum:${{ steps.rechenraum.outputs.kennung }}" .
      - name: Rauchtest Rechenraum (Leifs Präambel mit pdflatex, Python-Pakete, Seitenbild, kein Internet)
        if: steps.rechenraum.outputs.hat != 'ja'
        run: |
          BILD="agentendorf-rechenraum:${{ steps.rechenraum.outputs.kennung }}"
          docker network create --internal rauchnetz
          docker run -d --name rr --network rauchnetz --read-only -u 1000:1000 \
            --mount type=tmpfs,destination=/tmp,tmpfs-mode=1777 --mount type=tmpfs,destination=/arbeit,tmpfs-mode=1777 \
            -e RECHENRAUM_GEHEIMNIS=ci-geheimnis-ci-geheimnis-ci-geheimnis-12 "$BILD"
          for i in $(seq 1 30); do docker exec rr python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4100/gesundheit')" && break; sleep 1; done
          # read-only-Container: Skript über stdin statt docker cp
          docker exec -i rr python3 - < apps/rechenraum/test/rauchtest.py
          docker logs rr
      - name: Browser-Image bauen und rauchtesten (nur wenn der Server es nicht hat; Fehler blockieren den Deploy nicht)
        id: browserbau
        if: steps.rechenraum.outputs.browser_hat != 'ja'
        continue-on-error: true
        run: |
          BILD="agentendorf-browser:${{ steps.rechenraum.outputs.browser_kennung }}"
          docker build -f apps/browser/Dockerfile -t "$BILD" .
          docker run -d --name br --read-only --mount type=tmpfs,destination=/tmp,tmpfs-mode=1777 --shm-size 256m \
            -e BROWSER_GEHEIMNIS=ci-geheimnis-ci-geheimnis-ci-geheimnis-12 "$BILD"
          for i in $(seq 1 30); do docker exec br node -e "fetch('http://127.0.0.1:4200/gesundheit').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null && break; sleep 1; done
          docker exec br node -e "fetch('http://127.0.0.1:4200/gesundheit').then(r=>r.json()).then(j=>{console.log(j);process.exit(j.ok?0:1)})" || { docker logs br; exit 1; }
          # Chromium startet im Container und zeigt eine Seite
          docker exec br node --input-type=module -e "import { chromium } from 'playwright-core'; const b = await chromium.launch(); const p = await b.newPage(); await p.setContent('<h1>Rauchtest</h1>'); console.log(await p.textContent('h1')); await b.close();" | grep -q Rauchtest
          # ohne Zugangsdaten: klare Meldung statt Absturz
          docker exec br node runner.js pruefen 2>&1 | tee /tmp/pruefen.txt || true
          grep -q 'Keine Moodle-Zugangsdaten\|nicht erreichbar\|Seite lädt nicht' /tmp/pruefen.txt
          docker logs br
          docker rm -f br
      - name: Codehaus-Image bauen und rauchtesten (nur wenn der Server es will und nicht hat; Fehler blockieren den Deploy nicht)
        id: codingbau
        if: steps.rechenraum.outputs.coding_hat == 'nein'
        continue-on-error: true
        run: |
          BILD="agentendorf-coding:${{ steps.rechenraum.outputs.coding_kennung }}"
          docker build -f apps/coding/Dockerfile -t "$BILD" .
          docker image ls "$BILD"
          bash apps/coding/test/rauchtest.sh "$BILD"
      - name: Rauchtest des Images
        run: |
          mkdir -p /tmp/dorf/vault /tmp/dorf/daten /tmp/dorf/claude && sudo chown -R 1000:1000 /tmp/dorf
          docker run -d --name rauch -p 3000:3000 --read-only --tmpfs /tmp \
            -v /tmp/dorf/vault:/vault -v /tmp/dorf/daten:/daten -e ORIGIN=http://localhost:3000 agentendorf:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/gesundheit && break; sleep 1; done
          curl -fs http://localhost:3000/api/gesundheit
          curl -fs http://localhost:3000/ | grep -q Agentendorf
          test -f /tmp/dorf/vault/00_Stadtordnung/stadtordnung.md
          docker logs rauch
          # Werkstatt: startet, claude-CLI vorhanden, Gesundheit ohne Geheimnis erreichbar
          docker run -d --name werkstatt-rauch -p 4000:4000 --read-only -u 1000:1000 \
            --mount type=tmpfs,destination=/tmp,tmpfs-mode=1777 --mount type=tmpfs,destination=/arbeit,tmpfs-mode=1777 \
            -v /tmp/dorf/claude:/claude-konfig -e WERKSTATT_GEHEIMNIS=ci-geheimnis-ci-geheimnis-ci-geheimnis-12 agentendorf-werkstatt:ci
          for i in $(seq 1 30); do curl -fs http://localhost:4000/gesundheit && break; sleep 1; done
          curl -fs http://localhost:4000/gesundheit
          docker run --rm --entrypoint claude agentendorf-werkstatt:ci --version
      - name: Programme holen (nur wenn neu gebaut – auch wenn nur eine Plattform fertig wurde)
        if: needs.programme.result == 'success' || needs.programme.result == 'failure' || needs.programme.result == 'cancelled'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: programme-*
          path: programme-dl
      - name: An den Server ausliefern
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Deploy-Secrets fehlen noch – Auslieferung übersprungen."
            exit 0
          fi
          VERSION=$(git rev-parse --short=12 HEAD)
          RV="${{ steps.rechenraum.outputs.kennung }}"
          mkdir buendel && echo "$VERSION" > buendel/VERSION && cp -r deploy buendel/deploy
          echo "$RV" > buendel/RECHENRAUM_VERSION
          BV="${{ steps.rechenraum.outputs.browser_kennung }}"
          MIT_BROWSER=nein
          if [ "${{ steps.rechenraum.outputs.browser_hat }}" = ja ]; then MIT_BROWSER=vorhanden
          elif [ "${{ steps.browserbau.outcome }}" = success ]; then MIT_BROWSER=bild; fi
          [ "$MIT_BROWSER" = nein ] || echo "$BV" > buendel/BROWSER_VERSION
          echo "Moodle-Browser: $MIT_BROWSER"
          # Codehaus: wie der Browser – Kennung nur mitschicken, wenn der Server das Image hat oder es jetzt bekommt
          CV="${{ steps.rechenraum.outputs.coding_kennung }}"
          MIT_CODING=nein
          if [ "${{ steps.rechenraum.outputs.coding_hat }}" = ja ]; then MIT_CODING=vorhanden
          elif [ "${{ steps.rechenraum.outputs.coding_hat }}" = nein ] && [ "${{ steps.codingbau.outcome }}" = success ]; then MIT_CODING=bild; fi
          [ "$MIT_CODING" = nein ] || echo "$CV" > buendel/CODING_VERSION
          echo "Codehaus: $MIT_CODING"
          docker tag agentendorf:ci "agentendorf:$VERSION"
          docker tag agentendorf-werkstatt:ci "agentendorf-werkstatt:$VERSION"
          docker save "agentendorf:$VERSION" "agentendorf-werkstatt:$VERSION" | gzip > buendel/image.tar.gz
          DATEIEN="VERSION RECHENRAUM_VERSION deploy image.tar.gz"
          [ "$MIT_BROWSER" = nein ] || DATEIEN="$DATEIEN BROWSER_VERSION"
          if [ "$MIT_BROWSER" = bild ]; then
            docker save "agentendorf-browser:$BV" | gzip > buendel/browser.tar.gz
            DATEIEN="$DATEIEN browser.tar.gz"
          fi
          [ "$MIT_CODING" = nein ] || DATEIEN="$DATEIEN CODING_VERSION"
          if [ "$MIT_CODING" = bild ]; then
            docker save "agentendorf-coding:$CV" | gzip > buendel/coding.tar.gz
            DATEIEN="$DATEIEN coding.tar.gz"
          fi
          if [ "${{ steps.rechenraum.outputs.hat }}" != ja ]; then
            docker save "agentendorf-rechenraum:$RV" | gzip > buendel/rechenraum.tar.gz
            DATEIEN="$DATEIEN rechenraum.tar.gz"
          fi
          if [ -d programme-dl ] && [ -n "$(ls programme-dl 2>/dev/null)" ]; then
            bash deploy/programme-manifest.sh programme-dl buendel/programme
            # nur vollständig (derzeit nur Windows) gilt die Kennung – sonst baut der nächste Lauf beide neu
            if [ -d programme-dl/programme-Windows ]; then
              echo "${{ needs.programme-pruefen.outputs.kennung }}" > buendel/PROGRAMME_KENNUNG
            else
              echo "::warning::Nicht alle Programme gebaut – ausgeliefert wird, was da ist."
              echo 0000000000000000 > buendel/PROGRAMME_KENNUNG
            fi
            DATEIEN="$DATEIEN programme PROGRAMME_KENNUNG"
          fi
          # shellcheck disable=SC2086
          tar -czf buendel.tar.gz -C buendel $DATEIEN
          ls -lh buendel.tar.gz
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" empfangen < buendel.tar.gz
