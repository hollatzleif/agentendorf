name: Prüfen und ausliefern

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dorf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typen prüfen
        run: pnpm typecheck
      - name: Bauen
        run: pnpm build
      - name: Server- und Werkstatt-Tests (Leine, Freigaben, Motoren, Vault-Regeln, Login, Moodle, Rechenraum)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pnpm test
      - name: Rechenraum-Runner (Geheimnis, Zeitlimit, Pfade, Aufräumen)
        run: python3 -m unittest discover -s apps/rechenraum/test -v
      - name: Browser-Tests (Desktop und Handy)
        run: |
          pnpm --filter @dorf/web exec playwright install --with-deps chromium
          pnpm e2e
      - name: Moodle-Browser gegen nachgebautes Moodle (Anmeldung, Leine, Download)
        run: pnpm --filter @dorf/browser e2e
      - name: Backup- und Deploy-Tests (7 Tage, Wiederherstellung, Rollback)
        run: |
          sudo apt-get install -y -q restic sqlite3 jq shellcheck
          bash deploy/test/backup-test.sh
          bash deploy/test/empfangen-test.sh
          bash deploy/test/moodle-anmelden-test.sh
      - name: Shell-Skripte prüfen
        run: shellcheck -x -S warning deploy/dorf deploy/bootstrap.sh deploy/test/*.sh

  ausliefern:
    name: Image bauen und deployen
    needs: pruefen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SSH vorbereiten und fragen, ob der Server das Rechenraum-Image schon hat
        id: rechenraum
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Kennung = Hash über Dockerfile und Runner; gleiches Rezept → gleiches Image → nicht erneut schicken
          RV=$(cat apps/rechenraum/Dockerfile apps/rechenraum/runner.py | sha256sum | cut -c1-16)
          echo "kennung=$RV" >> "$GITHUB_OUTPUT"
          HAT=nein
          if [ -n "$DEPLOY_HOST" ] && [ "${{ github.ref }}" = refs/heads/main ] && [ "${{ github.event_name }}" != pull_request ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            # ältere dorf-Skripte kennen hat-image nicht → wie „nein“ behandeln
            HAT=$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "hat-image $RV" 2>/dev/null || echo nein)
          fi
          echo "Server hat agentendorf-rechenraum:$RV: $HAT"
          echo "hat=$HAT" >> "$GITHUB_OUTPUT"
          # Moodle-Browser: gleiche Idee; ältere dorf-Skripte kennen hat-browser nicht → „nein“
          BV=$(cat apps/browser/Dockerfile apps/browser/package.json apps/browser/src/*.ts | sha256sum | cut -c1-16)
          echo "browser_kennung=$BV" >> "$GITHUB_OUTPUT"
          HATB=nein
          if [ -f ~/.ssh/id_ed25519 ]; then
            HATB=$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "hat-browser $BV" 2>/dev/null || echo nein)
          fi
          [ "$HATB" = ja ] || HATB=nein
          echo "Server hat agentendorf-browser:$BV: $HATB"
          echo "browser_hat=$HATB" >> "$GITHUB_OUTPUT"
      - name: Images bauen
        run: |
          docker build -t agentendorf:ci .
          docker build -f apps/werkstatt/Dockerfile -t agentendorf-werkstatt:ci .
      - name: Rechenraum-Image bauen (nur wenn der Server es noch nicht hat)
        if: steps.rechenraum.outputs.hat != 'ja'
        run: docker build -f apps/rechenraum/Dockerfile -t "agentendorf-rechenraum:${{ steps.rechenraum.outputs.kennung }}" .
      - name: Rauchtest Rechenraum (Leifs Präambel mit pdflatex, Python-Pakete, Seitenbild, kein Internet)
        if: steps.rechenraum.outputs.hat != 'ja'
        run: |
          BILD="agentendorf-rechenraum:${{ steps.rechenraum.outputs.kennung }}"
          docker network create --internal rauchnetz
          docker run -d --name rr --network rauchnetz --read-only -u 1000:1000 \
            --mount type=tmpfs,destination=/tmp,tmpfs-mode=1777 --mount type=tmpfs,destination=/arbeit,tmpfs-mode=1777 \
            -e RECHENRAUM_GEHEIMNIS=ci-geheimnis-ci-geheimnis-ci-geheimnis-12 "$BILD"
          for i in $(seq 1 30); do docker exec rr python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4100/gesundheit')" && break; sleep 1; done
          # read-only-Container: Skript über stdin statt docker cp
          docker exec -i rr python3 - < apps/rechenraum/test/rauchtest.py
          docker logs rr
      - name: Browser-Image bauen und rauchtesten (nur wenn der Server es nicht hat; Fehler blockieren den Deploy nicht)
        id: browserbau
        if: steps.rechenraum.outputs.browser_hat != 'ja'
        continue-on-error: true
        run: |
          BILD="agentendorf-browser:${{ steps.rechenraum.outputs.browser_kennung }}"
          docker build -f apps/browser/Dockerfile -t "$BILD" .
          docker run -d --name br --read-only --mount type=tmpfs,destination=/tmp,tmpfs-mode=1777 --shm-size 256m \
            -e BROWSER_GEHEIMNIS=ci-geheimnis-ci-geheimnis-ci-geheimnis-12 "$BILD"
          for i in $(seq 1 30); do docker exec br node -e "fetch('http://127.0.0.1:4200/gesundheit').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break; sleep 1; done
          # Chromium startet im Container und zeigt eine Seite
          docker exec br node --input-type=module -e "import { chromium } from 'playwright-core'; const b = await chromium.launch(); const p = await b.newPage(); await p.setContent('<h1>Rauchtest</h1>'); console.log(await p.textContent('h1')); await b.close();" | grep -q Rauchtest
          # ohne Zugangsdaten: klare Meldung statt Absturz
          docker exec br node runner.js pruefen 2>&1 | tee /tmp/pruefen.txt || true
          grep -q 'Keine Moodle-Zugangsdaten\|nicht erreichbar\|Seite lädt nicht' /tmp/pruefen.txt
          docker logs br
          docker rm -f br
      - name: Rauchtest des Images
        run: |
          mkdir -p /tmp/dorf/vault /tmp/dorf/daten /tmp/dorf/claude && sudo chown -R 1000:1000 /tmp/dorf
          docker run -d --name rauch -p 3000:3000 --read-only --tmpfs /tmp \
            -v /tmp/dorf/vault:/vault -v /tmp/dorf/daten:/daten -e ORIGIN=http://localhost:3000 agentendorf:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/gesundheit && break; sleep 1; done
          curl -fs http://localhost:3000/api/gesundheit
          curl -fs http://localhost:3000/ | grep -q Agentendorf
          test -f /tmp/dorf/vault/00_Stadtordnung/stadtordnung.md
          docker logs rauch
          # Werkstatt: startet, claude-CLI vorhanden, Gesundheit ohne Geheimnis erreichbar
          docker run -d --name werkstatt-rauch -p 4000:4000 --read-only -u 1000:1000 \
            --mount type=tmpfs,destination=/tmp,tmpfs-mode=1777 --mount type=tmpfs,destination=/arbeit,tmpfs-mode=1777 \
            -v /tmp/dorf/claude:/claude-konfig -e WERKSTATT_GEHEIMNIS=ci-geheimnis-ci-geheimnis-ci-geheimnis-12 agentendorf-werkstatt:ci
          for i in $(seq 1 30); do curl -fs http://localhost:4000/gesundheit && break; sleep 1; done
          curl -fs http://localhost:4000/gesundheit
          docker run --rm --entrypoint claude agentendorf-werkstatt:ci --version
      - name: An den Server ausliefern
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Deploy-Secrets fehlen noch – Auslieferung übersprungen."
            exit 0
          fi
          VERSION=$(git rev-parse --short=12 HEAD)
          RV="${{ steps.rechenraum.outputs.kennung }}"
          mkdir buendel && echo "$VERSION" > buendel/VERSION && cp -r deploy buendel/deploy
          echo "$RV" > buendel/RECHENRAUM_VERSION
          BV="${{ steps.rechenraum.outputs.browser_kennung }}"
          MIT_BROWSER=nein
          if [ "${{ steps.rechenraum.outputs.browser_hat }}" = ja ]; then MIT_BROWSER=vorhanden
          elif [ "${{ steps.browserbau.outcome }}" = success ]; then MIT_BROWSER=bild; fi
          [ "$MIT_BROWSER" = nein ] || echo "$BV" > buendel/BROWSER_VERSION
          echo "Moodle-Browser: $MIT_BROWSER"
          docker tag agentendorf:ci "agentendorf:$VERSION"
          docker tag agentendorf-werkstatt:ci "agentendorf-werkstatt:$VERSION"
          docker save "agentendorf:$VERSION" "agentendorf-werkstatt:$VERSION" | gzip > buendel/image.tar.gz
          DATEIEN="VERSION RECHENRAUM_VERSION deploy image.tar.gz"
          [ "$MIT_BROWSER" = nein ] || DATEIEN="$DATEIEN BROWSER_VERSION"
          if [ "$MIT_BROWSER" = bild ]; then
            docker save "agentendorf-browser:$BV" | gzip > buendel/browser.tar.gz
            DATEIEN="$DATEIEN browser.tar.gz"
          fi
          if [ "${{ steps.rechenraum.outputs.hat }}" != ja ]; then
            docker save "agentendorf-rechenraum:$RV" | gzip > buendel/rechenraum.tar.gz
            DATEIEN="$DATEIEN rechenraum.tar.gz"
          fi
          # shellcheck disable=SC2086
          tar -czf buendel.tar.gz -C buendel $DATEIEN
          ls -lh buendel.tar.gz
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" empfangen < buendel.tar.gz
