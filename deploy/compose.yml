# Agentendorf – Docker Compose (Produktion). Gestartet wird über ./dorf, nicht direkt.
# Pfade auf dem Server: /srv/dorf/{vault,daten,syncthing,backup}, Geheimnisse in /srv/dorf/.env
name: dorf

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DORF_DOMAIN: ${DORF_DOMAIN:?DORF_DOMAIN fehlt in /srv/dorf/.env}
      # Codehaus (E191): VS Code auf eigener Adresse (eigener Ursprung) – Standard code.<Dorf-Adresse>
      CODING_DOMAIN: ${CODING_DOMAIN:-code.${DORF_DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
      - caddy-konfig:/config
    depends_on:
      - dorf
    mem_limit: 128m
    networks: [default, codingnetz]

  dorf:
    image: agentendorf:${DORF_VERSION:-latest}
    restart: unless-stopped
    env_file: /srv/dorf/.env
    environment:
      ORIGIN: https://${DORF_DOMAIN}
      HINTER_PROXY: "true"
      # E195: X-Forwarded-For nur von Caddy glauben – nicht von Werkstatt, Codehaus, Rechenraum oder Browser (alle erreichen dorf:3000)
      VERTRAUTER_PROXY: caddy
      DORF_VERSION: ${DORF_VERSION:-unbekannt}
      WERKSTATT_URL: http://werkstatt:4000
      CODING_URL: http://coding:4000
      CODING_ADRESSE: https://${CODING_DOMAIN:-code.${DORF_DOMAIN}}
      TZ: Europe/Vienna
      # Wetter im Dorf und in der Morgenzeitung (Open-Meteo, frei, ohne Konto; geht nur die Ortsangabe Konstanz hinaus)
      WETTER_ORT: ${WETTER_ORT:-Konstanz}
      WETTER_URL: ${WETTER_URL:-https://api.open-meteo.com/v1/forecast?latitude=47.66&longitude=9.18&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=1}
    user: "${DORF_UID:-1000}:${DORF_UID:-1000}"
    volumes:
      - /srv/dorf/vault:/vault
      - /srv/dorf/daten:/daten
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777 }
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    networks: [default, rechennetz, browsernetz, codingnetz]
    # kein Port nach außen – nur Caddy spricht mit dem Dorf (3000); die Werkstatt ruft Werkzeuge über 3001 auf

  werkstatt:
    # unverändertes claude-CLI mit Leifs Abo. Vault NUR LESBAR. Kein API-Schlüssel, keine anderen Geheimnisse.
    image: agentendorf-werkstatt:${DORF_VERSION:-latest}
    restart: unless-stopped
    env_file: /srv/dorf/werkstatt.env
    environment:
      DORF_INTERN_URL: http://dorf:3001
      TZ: Europe/Vienna
    user: "${DORF_UID:-1000}:${DORF_UID:-1000}"
    read_only: true
    # tmpfs ausdrücklich mit 1777: sonst übernimmt Docker die Rechte aus dem Image mit root als Besitzer (EACCES)
    volumes:
      - /srv/dorf/vault:/vault:ro
      - /srv/dorf/claude:/claude-konfig
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777 }
      - type: tmpfs
        target: /arbeit
        tmpfs: { mode: 01777 }
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m

  rechenraum:
    # pdflatex + Python für „Abgabe bearbeiten“. KEIN Internet (internes Netz), KEIN Vault, nur das Dorf erreicht ihn.
    # Image-Kennung = Hash über Dockerfile und Runner (wird nur neu geschickt, wenn sie sich ändern).
    image: agentendorf-rechenraum:${RECHENRAUM_VERSION:-fehlt}
    restart: unless-stopped
    env_file: /srv/dorf/rechenraum.env
    environment:
      TZ: Europe/Vienna
    user: "1000:1000"
    read_only: true
    networks: [rechennetz]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777, size: 268435456 }
      - type: tmpfs
        target: /arbeit
        tmpfs: { mode: 01777, size: 402653184 }
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # E195 – Rechnung in MB (tmpfs zählt zum Speicher des Containers; Messwerte in runner.py):
    #   /tmp 256 + /arbeit 384 (beide voll) + 2 Umwandlungen gleichzeitig × 260 (whisper base-q5_1 belegt ~208, dazu
    #   das Python-Kind) + Runner und ein LaTeX-/Python-Befehl ~120 = 1280.
    # Die Adressraum-Grenze je Umwandlung (1024 MB) liegt darüber – sie kann nicht kleiner sein (runner.py). Belegt eine
    # Umwandlung wirklich so viel, beendet der Kernel genau sie (oom_score_adj 1000), der Runner läuft weiter.
    mem_limit: 1280m
    cpus: 1.0
    pids_limit: 256

  browser:
    # Chromium für den Moodle-Browser-Agenten (nur lesen; Leine im Runner: nur JKU-Domains, kein Formular-Senden).
    # Kennt Leifs JKU-Zugang (browser.env, als Datei eingebunden), sonst nichts: kein Vault, keine anderen Schlüssel.
    # Startet nur, wenn die Version ein Browser-Image mitbringt (Profil „browser“, setzt ./dorf).
    profiles: [browser]
    image: agentendorf-browser:${BROWSER_VERSION:-fehlt}
    restart: unless-stopped
    environment:
      TZ: Europe/Vienna
      HOME: /tmp
      BROWSER_KONFIG: /geheim/browser.env
    user: "1000:1000"
    read_only: true
    networks: [browsernetz]
    volumes:
      - /srv/dorf/browser.env:/geheim/browser.env:ro
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777, size: 536870912 }
    shm_size: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512

  coding:
    # Codehaus (E191): VS Code im Browser (openvscode-server, nach außen über das Tor im Runner auf Port 3000 – E195) + Runner für Coding-Agenten (Port 4000, claude-CLI
    # mit Bash/Edit/Write). Leifs Entscheidung: Internet, GitHub (klonen/pushen/PR/mergen) und der Vault LES- UND SCHREIBBAR.
    # Dafür streng getrennt: eigenes Netz (erreicht nur Dorf und Caddy, nicht Werkstatt/Syncthing/Rechenraum/Browser),
    # eigene Geheimnisse (coding.env: Abo-Token, GitHub-Token, Git-Name – NICHTS aus /srv/dorf/.env), kein root, keine
    # Rechte-Ausweitung, Abbild nur lesbar. Startet erst nach `dorf coding-einrichten` (Profil „coding“, setzt ./dorf).
    profiles: [coding]
    image: agentendorf-coding:${CODING_VERSION:-fehlt}
    restart: unless-stopped
    # Geheimnisse: /srv/dorf/coding.env wird als DATEI eingehängt und von start.sh gelesen (wie beim Moodle-Browser) –
    # kein env_file: Die Form mit „required: false“ braucht Docker Compose ≥ 2.24, und die einfache Form ließe ältere
    # Fassungen schon am Fehlen der Datei scheitern (erster Deploy dieser Fassung, Codehaus gar nicht eingerichtet).
    environment:
      DORF_INTERN_URL: http://dorf:3001
      CODING_KONFIG: /geheim/coding.env
      TZ: Europe/Vienna
    user: "${DORF_UID:-1000}:${DORF_UID:-1000}"
    read_only: true
    networks: [codingnetz]
    volumes:
      # Projekte + Heimordner (VS-Code-Einstellungen, Erweiterungen, npm/pip des Benutzers) – bleibt über Neustarts
      - /srv/dorf/coding:/arbeit
      - /srv/dorf/vault:/vault
      - /srv/dorf/claude-coding:/claude-konfig
      - /srv/dorf/coding.env:/geheim/coding.env:ro
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777, size: 268435456 }
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Bauen und Testen braucht Platz; die Grenze schützt das Dorf (CODING_MEM in /srv/dorf/.env ändert sie)
    mem_limit: ${CODING_MEM:-2g}
    # halbes Gewicht: unter Last hat das Dorf Vorrang, ohne Last darf das Codehaus alle Kerne nutzen
    cpu_shares: 512
    pids_limit: 1024

  syncthing:
    image: syncthing/syncthing:2
    restart: unless-stopped
    hostname: agentendorf
    environment:
      PUID: ${DORF_UID:-1000}
      PGID: ${DORF_UID:-1000}
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
      - /srv/dorf/syncthing:/var/syncthing
      - /srv/dorf/vault:/var/syncthing/vault
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      # Oberfläche nur lokal – Zugriff per SSH-Tunnel (./dorf hilfe)
      - "127.0.0.1:8384:8384"
    mem_limit: 256m

networks:
  default: {}
  # Nur Dorf ↔ Rechenraum, ohne Weg ins Internet
  rechennetz:
    internal: true
  # Dorf ↔ Moodle-Browser; der Browser braucht Internet (moodle.jku.at), die Leine im Runner begrenzt auf JKU
  browsernetz: {}
  # Codehaus: Caddy → VS Code (3000), Dorf → Runner (4000), Runner → Dorf-Werkzeuge (3001, Lauf-Token). Mit Internet
  # (npm, pip, git). Werkstatt, Rechenraum, Browser und Syncthing hängen NICHT in diesem Netz.
  codingnetz: {}

volumes:
  caddy-daten:
  caddy-konfig:
