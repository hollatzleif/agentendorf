# Agentendorf – Docker Compose (Produktion). Gestartet wird über ./dorf, nicht direkt.
# Pfade auf dem Server: /srv/dorf/{vault,daten,syncthing,backup}, Geheimnisse in /srv/dorf/.env
name: dorf

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DORF_DOMAIN: ${DORF_DOMAIN:?DORF_DOMAIN fehlt in /srv/dorf/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
      - caddy-konfig:/config
    depends_on:
      - dorf
    mem_limit: 128m

  dorf:
    image: agentendorf:${DORF_VERSION:-latest}
    restart: unless-stopped
    env_file: /srv/dorf/.env
    environment:
      ORIGIN: https://${DORF_DOMAIN}
      HINTER_PROXY: "true"
      DORF_VERSION: ${DORF_VERSION:-unbekannt}
      WERKSTATT_URL: http://werkstatt:4000
      TZ: Europe/Vienna
    user: "${DORF_UID:-1000}:${DORF_UID:-1000}"
    volumes:
      - /srv/dorf/vault:/vault
      - /srv/dorf/daten:/daten
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777 }
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    networks: [default, rechennetz]
    # kein Port nach außen – nur Caddy spricht mit dem Dorf (3000); die Werkstatt ruft Werkzeuge über 3001 auf

  werkstatt:
    # unverändertes claude-CLI mit Leifs Abo. Vault NUR LESBAR. Kein API-Schlüssel, keine anderen Geheimnisse.
    image: agentendorf-werkstatt:${DORF_VERSION:-latest}
    restart: unless-stopped
    env_file: /srv/dorf/werkstatt.env
    environment:
      DORF_INTERN_URL: http://dorf:3001
      TZ: Europe/Vienna
    user: "${DORF_UID:-1000}:${DORF_UID:-1000}"
    read_only: true
    # tmpfs ausdrücklich mit 1777: sonst übernimmt Docker die Rechte aus dem Image mit root als Besitzer (EACCES)
    volumes:
      - /srv/dorf/vault:/vault:ro
      - /srv/dorf/claude:/claude-konfig
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777 }
      - type: tmpfs
        target: /arbeit
        tmpfs: { mode: 01777 }
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m

  rechenraum:
    # pdflatex + Python für „Abgabe bearbeiten“. KEIN Internet (internes Netz), KEIN Vault, nur das Dorf erreicht ihn.
    # Image-Kennung = Hash über Dockerfile und Runner (wird nur neu geschickt, wenn sie sich ändern).
    image: agentendorf-rechenraum:${RECHENRAUM_VERSION:-fehlt}
    restart: unless-stopped
    env_file: /srv/dorf/rechenraum.env
    environment:
      TZ: Europe/Vienna
    user: "1000:1000"
    read_only: true
    networks: [rechennetz]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777, size: 268435456 }
      - type: tmpfs
        target: /arbeit
        tmpfs: { mode: 01777, size: 402653184 }
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  syncthing:
    image: syncthing/syncthing:2
    restart: unless-stopped
    hostname: agentendorf
    environment:
      PUID: ${DORF_UID:-1000}
      PGID: ${DORF_UID:-1000}
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
      - /srv/dorf/syncthing:/var/syncthing
      - /srv/dorf/vault:/var/syncthing/vault
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      # Oberfläche nur lokal – Zugriff per SSH-Tunnel (./dorf hilfe)
      - "127.0.0.1:8384:8384"
    mem_limit: 256m

networks:
  default: {}
  # Nur Dorf ↔ Rechenraum, ohne Weg ins Internet
  rechennetz:
    internal: true

volumes:
  caddy-daten:
  caddy-konfig:
