<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkliste</title>
<style>
:root{
 --bg:#f6f6f3; --surface:#ffffff; --surface-2:#fafaf8; --text:#1c1c1e; --muted:#66666c; --border:#e2e2dd; --accent:#3c4a8a;
 --exam:#c62828; --exam-bg:#fde7e7; --ok:#1d7f3b; --ok-bg:#e3f3e8; --warn:#b07900; --warn-bg:#fff4cc; --blue:#1f63c6; --blue-bg:#e7effc; --gray-bg:#efefeb;
 --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){ :root{
 --bg:#141416; --surface:#1d1d20; --surface-2:#232327; --text:#ececee; --muted:#a0a0a8; --border:#34343a; --accent:#9fb0ff;
 --exam:#ff7b72; --exam-bg:#3a1c1c; --ok:#6fd38d; --ok-bg:#16301f; --warn:#f5c84b; --warn-bg:#352b10; --blue:#7fb0ff; --blue-bg:#1a2740; --gray-bg:#26262a; --shadow:none;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
code{font-size:13px;background:var(--gray-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:19px;margin:30px 0 10px}
.sub{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden;margin:8px 0 2px;max-width:420px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.progress{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.t-abgabe{background:var(--exam-bg);color:var(--exam)}
.t-pruef{background:var(--exam-bg);color:var(--exam);box-shadow:inset 0 0 0 1px var(--exam)}
.t-pflicht{background:var(--ok-bg);color:var(--ok)}
.t-todo{background:var(--blue-bg);color:var(--blue)}
.t-klaeren{background:var(--warn-bg);color:var(--warn)}
.t-opt{background:var(--gray-bg);color:var(--muted)}
.day>h3{font-size:16px;margin:22px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.day>h3 span{color:var(--muted);font-weight:400;font-size:13px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden}
.task>summary{list-style:none;cursor:pointer;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.task>summary::-webkit-details-marker{display:none}
.task .ttl{font-weight:650}
.task .when{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;margin-right:6px}
.task .count{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.task.alldone{opacity:.62}
.task.alldone .ttl{text-decoration:line-through}
.body{padding:0 14px 12px}
.stand{font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin:0 0 8px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--border);counter-increment:s}
ol.steps li:first-child{border-top:0}
ol.steps input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--accent)}
ol.steps label{cursor:pointer;font-size:14.5px}
ol.steps label::before{content:counter(s) ". ";color:var(--muted);font-variant-numeric:tabular-nums}
ol.steps li.done label{color:var(--muted);text-decoration:line-through}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);margin:0 0 12px}
.box.red{border-left:4px solid var(--exam)}
.box.ok{border-left:4px solid var(--ok)}
.box ul{margin:6px 0 0;padding-left:20px}
.box li{margin:3px 0}
.copy textarea{width:100%;min-height:90px;font:inherit;font-size:14px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.tools button,.copy button{font:inherit;font-size:13px;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
footer{margin-top:28px;color:var(--muted);font-size:13px}
@media (max-width:480px){h1{font-size:22px}}
</style></head>
<body><div class="wrap">
<header>
 <h1 id="titel"></h1>
 <div class="sub" id="sub"></div>
 <div class="bar"><i id="barfill"></i></div><div class="progress" id="progress"></div>
</header>
<div class="legend">
 <span class="tag t-abgabe">Abgabe</span><span class="tag t-pruef">Prüfung</span><span class="tag t-pflicht">Pflichttermin</span><span class="tag t-todo">Vorbereiten</span><span class="tag t-klaeren">Klären</span><span class="tag t-opt">Freiwillig</span>
</div>
<div class="tools"><button type="button" id="openAll">Alle aufklappen</button><button type="button" id="closeAll">Alle zuklappen</button><button type="button" id="openOpen">Nur offene aufklappen</button></div>
<div id="kopfboxen" style="margin-top:16px"></div>
<div id="tasks"></div>
<div id="nichtnoetig"></div>
<footer id="quellen"></footer>
</div>

<script>
/* ===== DORF-DATEN-ANFANG – nur diesen Block bei jeder neuen Fassung ersetzen ===== */
// HTML in Texten ist erlaubt (<b>, <code>). IDs (task.id) für dieselbe Aufgabe in jeder Fassung GLEICH lassen –
// daran hängen Leifs Häkchen. Schritte nur hinten anfügen, nicht umsortieren (Häkchen-ID = task.id + Schrittnummer).
const SEITE = {
  titel: 'Checkliste – Beispiel',
  stand: 'Stand: (Datum) · geprüft in Moodle, Kalender und Gmail',
  erledigt: ['Beispiel: Übung 3 abgegeben (laut Moodle)'],
  wichtig: ['Beispiel: neue Mail mit Frist'],
  nichtNoetig: [['Was Moodle anzeigt', 'Warum es nicht nötig ist']],
  quellen: 'Quellen: …',
};
const DATA = [
  { day: 'Montag, 01.01.', note: '', tasks: [
    { id: 'beispiel-1', tag: 'abgabe', when: '23:59', title: 'Beispielkurs – Blatt 1 hochladen',
      stand: 'Noch nicht abgegeben. Blatt: <code>Uni/faecher/Beispielkurs/blatt1.pdf</code>',
      steps: ['Blatt lesen', 'Lösen', 'Als PDF hochladen'],
      kopie: '' }
  ]}
];
/* ===== DORF-DATEN-ENDE ===== */

const TAGS = {abgabe:['t-abgabe','Abgabe'], pruef:['t-pruef','Prüfung'], pflicht:['t-pflicht','Pflichttermin'], todo:['t-todo','Vorbereiten'], klaeren:['t-klaeren','Klären'], opt:['t-opt','Freiwillig']};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

document.getElementById('titel').innerHTML = SEITE.titel;
document.title = SEITE.titel.replace(/<[^>]+>/g, '');
document.getElementById('sub').innerHTML = SEITE.stand + ' · Häkchen werden im Dorf gespeichert';
const kb = document.getElementById('kopfboxen');
if (SEITE.erledigt && SEITE.erledigt.length) kb.insertAdjacentHTML('beforeend', '<div class="box ok"><b>Erledigt:</b><ul>' + SEITE.erledigt.map(x => '<li>' + x + '</li>').join('') + '</ul></div>');
if (SEITE.wichtig && SEITE.wichtig.length) kb.insertAdjacentHTML('beforeend', '<div class="box red"><b>Neu und wichtig:</b><ul>' + SEITE.wichtig.map(x => '<li>' + x + '</li>').join('') + '</ul></div>');
if (SEITE.nichtNoetig && SEITE.nichtNoetig.length) document.getElementById('nichtnoetig').innerHTML = '<h2>Geprüft – musst du nicht machen</h2><div class="box"><div class="tablewrap"><table><tr><th>Was angezeigt wird</th><th>Warum nicht nötig</th></tr>' + SEITE.nichtNoetig.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table></div></div>';
document.getElementById('quellen').innerHTML = SEITE.quellen || '';

const root = document.getElementById('tasks');
DATA.forEach(day => {
  const sec = document.createElement('section'); sec.className = 'day';
  sec.innerHTML = '<h3>' + day.day + (day.note ? ' <span>' + day.note + '</span>' : '') + '</h3>';
  day.tasks.forEach(t => {
    const det = document.createElement('details'); det.className = 'task'; det.dataset.id = t.id;
    const tg = TAGS[t.tag] || TAGS.todo;
    let html = '<summary><div><span class="when">' + (t.when || '') + '</span><span class="ttl">' + t.title + '</span> <span class="tag ' + tg[0] + '">' + tg[1] + '</span></div><span class="count"></span></summary><div class="body">';
    if (t.stand) html += '<div class="stand">' + t.stand + '</div>';
    html += '<ol class="steps">' + (t.steps || []).map((s, i) => { const id = t.id + '-' + i; return '<li><input type="checkbox" id="' + id + '"><label for="' + id + '">' + s + '</label></li>'; }).join('') + '</ol>';
    if (t.kopie) html += '<div class="copy"><p style="margin:12px 0 4px;font-weight:600">Text zum Kopieren</p><textarea readonly>' + esc(t.kopie) + '</textarea><button type="button" data-markieren>Markieren</button></div>';
    html += '</div>';
    det.innerHTML = html;
    sec.appendChild(det);
  });
  root.appendChild(sec);
});

// ---- Häkchen: im Dorf über die App gespeichert (Häkchen-Brücke), im Vollbild ersatzweise im Browser ----
const IM_DORF = window.parent !== window;
const KEY = 'checkliste_haekchen';
let state = {};
function save() {
  if (IM_DORF) parent.postMessage({ dorf: 'stand-speichern', stand: state }, '*');
  else { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
}
function anwenden() {
  document.querySelectorAll('ol.steps input').forEach(b => { b.checked = !!state[b.id]; });
  refresh();
}
function refresh() {
  let all = 0, done = 0;
  document.querySelectorAll('details.task').forEach(det => {
    const boxes = det.querySelectorAll('ol.steps input');
    let d = 0;
    boxes.forEach(b => { b.closest('li').classList.toggle('done', b.checked); if (b.checked) d++; });
    all += boxes.length; done += d;
    det.querySelector('.count').textContent = d + '/' + boxes.length;
    det.classList.toggle('alldone', d === boxes.length && boxes.length > 0);
  });
  document.getElementById('progress').textContent = done + ' von ' + all + ' Schritten erledigt';
  document.getElementById('barfill').style.width = (all ? Math.round(done / all * 100) : 0) + '%';
}
document.querySelectorAll('ol.steps input').forEach(b => b.addEventListener('change', () => { state[b.id] = b.checked; save(); refresh(); }));
document.querySelectorAll('[data-markieren]').forEach(btn => btn.addEventListener('click', () => { const t = btn.previousElementSibling; t.focus(); t.select(); }));
const setOpen = fn => document.querySelectorAll('details.task').forEach(d => d.open = fn(d));
document.getElementById('openAll').onclick = () => setOpen(() => true);
document.getElementById('closeAll').onclick = () => setOpen(() => false);
document.getElementById('openOpen').onclick = () => setOpen(d => !d.classList.contains('alldone'));

if (IM_DORF) {
  window.addEventListener('message', e => {
    if (e.data && e.data.dorf === 'stand') { state = (e.data.stand && typeof e.data.stand === 'object') ? e.data.stand : {}; anwenden(); setOpen(d => !d.classList.contains('alldone')); }
  });
  parent.postMessage({ dorf: 'stand-laden' }, '*');
} else {
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
  anwenden();
  setOpen(d => !d.classList.contains('alldone'));
}
refresh();
</script>
</body></html>
